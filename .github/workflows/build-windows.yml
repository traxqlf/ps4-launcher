name: Build Windows EXE
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: npm install
      - name: Compiler le launcher Windows
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build
      - name: Compresser les exécutables dans PulsePS4-windows.zip
        shell: pwsh
        run: |
          $files = @()
          $files += Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File
          $files += Get-Item -Path "src-tauri/target/release/pulseps4.exe" -ErrorAction SilentlyContinue
          if ($files.Count -eq 0) {
            Write-Error "Aucun exécutable trouvé pour l'archive."
            exit 1
          }
          $files | ForEach-Object { Write-Host "Ajout à l'archive : $($_.FullName)" }
          Compress-Archive -Path $files.FullName -DestinationPath "PulsePS4-windows.zip" -Force
      - name: Générer latest.json pour l'updater Tauri
        id: manifest
        shell: pwsh
        run: |
          $config = Get-Content -Path "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $version = $config.version
          if (-not $version) {
            Write-Error "Version introuvable dans src-tauri/tauri.conf.json."
            exit 1
          }

          $installer = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" -File |
            Select-Object -First 1
          if (-not $installer) {
            Write-Error "Installateur NSIS *-setup.exe introuvable."
            exit 1
          }

          $signaturePath = "$($installer.FullName).sig"
          if (-not (Test-Path $signaturePath)) {
            Write-Error "Signature $signaturePath introuvable (clé de signature absente ?)."
            exit 1
          }
          $signature = (Get-Content -Path $signaturePath -Raw).Trim()

          $url = "https://github.com/traxqlf/ps4-launcher/releases/download/v$version/$($installer.Name)"
          $pubDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")

          $latest = [ordered]@{
            version   = $version
            notes     = "PulsePS4 v$version"
            pub_date  = $pubDate
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $signature
                url       = $url
              }
            }
          }

          $json = $latest | ConvertTo-Json -Depth 6
          [System.IO.File]::WriteAllText(
            (Join-Path (Get-Location) "latest.json"),
            $json,
            (New-Object System.Text.UTF8Encoding($false))
          )
          Write-Host "latest.json généré : version $version -> $url"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"
      - name: Publier la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.manifest.outputs.version }}
          name: PulsePS4 v${{ steps.manifest.outputs.version }}
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            latest.json
            PulsePS4-windows.zip
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            src-tauri/target/release/pulseps4.exe
