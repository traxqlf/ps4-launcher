name: Build Windows EXE
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: npm install
      - run: npm run tauri build
      - name: Compresser les exécutables dans ps4-launcher-windows.zip
        shell: pwsh
        run: |
          $files = @()
          $files += Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File
          $files += Get-Item -Path "src-tauri/target/release/ps4-launcher.exe" -ErrorAction SilentlyContinue
          if ($files.Count -eq 0) {
            Write-Error "Aucun exécutable trouvé pour l'archive."
            exit 1
          }
          $files | ForEach-Object { Write-Host "Ajout à l'archive : $($_.FullName)" }
          Compress-Archive -Path $files.FullName -DestinationPath "ps4-launcher-windows.zip" -Force
      - name: Publier la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: PS4 Launcher v1.0.0
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            ps4-launcher-windows.zip
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/ps4-launcher.exe
