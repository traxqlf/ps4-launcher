[package]
name = "ps4-launcher"
version = "0.1.1"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ps4_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset` : lecture des musiques de thème via convertFileSrc.
tauri = { version = "2", features = ["protocol-asset", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Suivi des processus du jeu et lecture du registre GOG : Windows uniquement.
[target.'cfg(target_os = "windows")'.dependencies]
sysinfo = "0.32"
winreg = "0.52"
# Extraction des icônes .exe et encodage PNG, uniquement dans le binaire Windows.
winapi = { version = "0.3", features = ["winuser", "wingdi", "dwmapi", "processthreadsapi", "handleapi", "winbase", "winnt", "tlhelp32"] }
png = "0.17"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
